[project]
name = "entirius-py-pdf-generator"
version = "2.0.0"
description = "LaTeX-based PDF generator from a JSON document description"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "pylatex>=1.4",
    "PyPDF2>=2.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/entirius/entirius-py-pdf-generator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_generator"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Legacy LaTeX builder migrated 1:1: mutable-default args (B006) and pre-existing dead
# symbols (F811/F841) left untouched — cleanup deferred so migration doesn't alter logic.
"src/pdf_generator/worker/latex.py" = ["B006", "B007", "F811", "F841"]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["pdf_generator"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
