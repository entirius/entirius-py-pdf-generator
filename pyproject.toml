[project]
name = "entirius-py-pdf-generator"
version = "2.0.0"
description = "LaTeX-based PDF generator from a JSON document, part of Entirius, the open-source modular ecommerce platform"
keywords = ["pdf", "latex", "pylatex", "document-generation", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "pylatex>=1.4",
    "PyPDF2>=2.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://docs.entirius.com/"
Repository = "https://github.com/entirius/entirius-py-pdf-generator"
Changelog = "https://github.com/entirius/entirius-py-pdf-generator/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-py-pdf-generator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_generator"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Legacy LaTeX builder migrated 1:1: mutable-default args (B006) and pre-existing dead
# symbols (F811/F841) left untouched — cleanup deferred so migration doesn't alter logic.
"src/pdf_generator/worker/latex.py" = ["B006", "B007", "F811", "F841"]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["pdf_generator"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
